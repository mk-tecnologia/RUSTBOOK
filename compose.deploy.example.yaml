# Standalone address book for installations with existing hbbs/hbbr.
# Copy to compose.deploy.yaml and configure .env. Does not manage relay/ID services.
services:
  address-book:
    image: local/rustdesk-address-book:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    container_name: rustdesk-address-book
    ports:
      - "${BIND_IP:-127.0.0.1}:21114:21114"
    volumes:
      - ./data:/data
    environment:
      RUSTDESK_AB_DB_PATH: /data/db.sqlite3
      RUSTDESK_AB_JWT_SECRET: ${RUSTDESK_AB_JWT_SECRET:?Set RUSTDESK_AB_JWT_SECRET in .env}
      RUSTDESK_AB_ADMIN_PASSWORD: ${RUSTDESK_AB_ADMIN_PASSWORD:?Set RUSTDESK_AB_ADMIN_PASSWORD in .env}
      RUSTDESK_AB_ADMIN_USERNAME: ${RUSTDESK_AB_ADMIN_USERNAME:-admin}
      RUSTDESK_AB_TOKEN_EXPIRY_HOURS: ${RUSTDESK_AB_TOKEN_EXPIRY_HOURS:-168}
      RUSTDESK_AB_CORS_ORIGINS: ${RUSTDESK_AB_CORS_ORIGINS:-}
      RUSTDESK_AB_ALLOW_UNAUTHENTICATED_DEVICE_EVENTS: ${RUSTDESK_AB_ALLOW_UNAUTHENTICATED_DEVICE_EVENTS:-false}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
