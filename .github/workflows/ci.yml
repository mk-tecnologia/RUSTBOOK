name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check product versions and verifier syntax
        run: |
          python3 scripts/check_version.py
          python3 -m py_compile scripts/verify_client_api.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Audit frontend dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Frontend regression tests
        run: npm --prefix web test
      - name: Typecheck and build frontend
        run: npm --prefix web run build
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
